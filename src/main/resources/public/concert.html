<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Concert Management</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
</head>
<body>
    <h1>Concert Management</h1>

    <h2>Add New Concert</h2>
    <form id="addConcertForm">
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required><br><br>

        <label for="date">Date:</label>
        <input type="date" id="date" name="date" required><br><br>

        <label for="performer">Performer:</label>
        <input type="text" id="performer" name="performer" required><br><br>

        <button type="submit">Add Concert</button>
    </form>
    <br>

    <h2>Concerts</h2>
    <table id="concertTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Date</th>
                <th>Performer</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <!-- Concerts will be loaded here -->
        </tbody>
    </table>

    <script>
        $(document).ready(function() {
            loadConcerts();

            // Add Concert form submit
            $("#addConcertForm").submit(function(event) {
                event.preventDefault();
                addConcert();
            });

            // Delete Concert button click
            $(document).on('click', '.deleteConcertBtn', function() {
                const concertId = $(this).data('id');
                deleteConcert(concertId);
            });
        });

        function loadConcerts() {
            $.ajax({
                url: "/concerts",
                type: "GET",
                dataType: "json",
                success: function(concerts) {
                    displayConcerts(concerts);
                },
                error: function() {
                    alert("Error loading concerts.");
                }
            });
        }

        function displayConcerts(concerts) {
            const concertTableBody = $("#concertTable tbody");
            concertTableBody.empty();

            $.each(concerts, function(index, concert) {
                const row = $("<tr>");
                row.append($("<td>").text(concert.id));
                row.append($("<td>").text(concert.title));
                row.append($("<td>").text(concert.date));
                row.append($("<td>").text(concert.performer));

                const actionsCell = $("<td>");
                actionsCell.append("<button class='deleteConcertBtn' data-id='" + concert.id + "'>Delete</button>");
                row.append(actionsCell);

                concertTableBody.append(row);
            });
        }

        function addConcert() {
            const newConcert = {
                title: $("#title").val(),
                date: $("#date").val(),
                performer: $("#performer").val()
            };

            $.ajax({
                url: "/concerts",
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(newConcert),
                success: function() {
                    loadConcerts(); // Refresh the concert list
                    $("#addConcertForm")[0].reset(); // Clear the form
                },
                error: function() {
                    alert("Error adding concert.");
                }
            });
        }

        function deleteConcert(concertId) {
            $.ajax({
                url: "/concerts/" + concertId,
                type: "DELETE",
                success: function() {
                    loadConcerts(); // Refresh the concert list
                },
                error: function() {
                    alert("Error deleting concert.");
                }
            });
        }
    </script>
</body>
</html>
