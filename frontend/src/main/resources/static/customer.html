<!DOCTYPE html>
<html>
<head>
    <title>Customer Management</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
</head>
<body>
    <h1>Customer Management</h1>

    <h2>Create New Customer</h2>
    <form id="newCustomerForm">
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required><br><br>

        <label for="address">Address:</label>
        <input type="text" id="address" name="address" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="phone">Phone:</label>
        <input type="tel" id="phone" name="phone" required><br><br>

        <label for="birthday">Birthday (dd-MM-yyyy):</label>
        <input type="text" id="birthday" name="birthday" required><br><br>

        <button type="submit">Create Customer</button>
    </form>

    <h2>All Customers</h2>
    <div id="customerList">
        <!-- Customer data will be displayed here -->
    </div>

    <script>
        $(document).ready(function() {
            // Function to fetch and display all customers
            function fetchCustomers() {
                $.ajax({
                    url: 'http://localhost:8081/customers', // the OTHER app - note the port!
                    type: 'GET',
                    success: function(data) {
                        $('#customerList').empty(); // Clear previous data
                        // TODO: loop over data with $.each and append a <div>
                        //       per customer to #customerList showing
                        //       fullname, address, email, tel, birthday
                        //       (template literal `...${customer.fullname}...`)
                    },
                    error: function(error) {
                        // TODO: log the error to the console
                    }
                });
            }

            // Initial fetch on page load
            fetchCustomers();

            // Handle form submission
            $('#newCustomerForm').submit(function(event) {
                event.preventDefault(); // Prevent default form submission

                // TODO: build a formData object from the input fields
                //       keys must match the backend JSON: fullname, address,
                //       email, tel, birthday

                // TODO: $.ajax POST to http://localhost:8081/customers with
                //       contentType 'application/json' and
                //       data JSON.stringify(formData);
                //       on success: fetchCustomers() and reset the form
            });
        });
    </script>
</body>
</html>
